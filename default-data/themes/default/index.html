<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>希沃白板</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060a12;
      --ink: #eef4ff;
      --muted: #9fb0d0;
      --accent: #6ea8ff;
      --accent-2: #8b7cff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      cursor: pointer;
      user-select: none;
    }
    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .aurora {
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(45% 40% at 20% 15%, rgba(70, 120, 255, .42), transparent 70%),
        radial-gradient(40% 35% at 85% 80%, rgba(139, 124, 255, .32), transparent 70%),
        radial-gradient(50% 45% at 50% 110%, rgba(40, 210, 170, .16), transparent 70%);
      filter: blur(20px);
      animation: drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes drift {
      0% { transform: translate3d(-2%, -1%, 0) scale(1.02); }
      100% { transform: translate3d(2%, 2%, 0) scale(1.08); }
    }
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(80% 70% at 50% 45%, transparent 45%, rgba(0, 0, 0, .55) 100%);
      pointer-events: none;
    }
    .content {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 28px 36px;
    }
    .mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 800;
      color: #07101f;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 18px 60px rgba(110, 168, 255, .45), inset 0 0 0 1px rgba(255, 255, 255, .25);
      animation: markIn 1.2s cubic-bezier(.2, .8, .2, 1) both;
    }
    .title {
      font-size: clamp(30px, 7.2vw, 64px);
      font-weight: 800;
      letter-spacing: .12em;
      margin: 6px 0 0;
      background: linear-gradient(180deg, #ffffff 0%, #c9dbff 55%, #8fa9e8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 10px 60px rgba(110, 168, 255, .25);
      animation: riseIn 1.1s .15s cubic-bezier(.2, .8, .2, 1) both;
    }
    .subtitle {
      font-size: clamp(9px, 1.1vw, 12px);
      letter-spacing: .4em;
      color: var(--muted);
      text-transform: uppercase;
      animation: riseIn 1.1s .3s cubic-bezier(.2, .8, .2, 1) both;
    }
    .hint {
      position: fixed;
      left: 50%;
      bottom: 42px;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: .22em;
      color: #c6d5f2;
      opacity: .9;
      animation: breathe 2.6s ease-in-out infinite;
      white-space: nowrap;
    }
    .hint.entering { animation: none; color: #fff; }
    .status {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: .08em;
      color: rgba(180, 198, 228, .7);
      min-height: 18px;
      white-space: nowrap;
    }
    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .7s ease;
    }
    body.entering .flash { opacity: 1; }
    body.entering .content { transform: scale(1.04); transition: transform .9s cubic-bezier(.2, .8, .2, 1); }
    body.entering .hint { opacity: 0; transition: opacity .25s ease; }
    body.entering .mark { filter: brightness(1.6); transition: filter .6s ease; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes markIn {
      from { opacity: 0; transform: scale(.7) rotate(-8deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes breathe {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="aurora"></div>
  <div class="vignette"></div>

  <main class="content">
    <div class="mark">希</div>
    <h1 class="title">希沃白板</h1>
    <div class="subtitle">Seewo EasiNote</div>
  </main>

  <div class="hint" id="hint">点击屏幕进入</div>
  <div class="status" id="status"></div>
  <div class="flash"></div>

  <script src="/_sdk.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const hint = document.getElementById("hint");
      const status = document.getElementById("status");
      let width = 0;
      let height = 0;
      let dpr = 1;
      let stars = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars = Array.from({ length: Math.round((width * height) / 9000) }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.4 + 0.3,
          a: Math.random() * 0.6 + 0.15,
          s: Math.random() * 0.16 + 0.02,
          p: Math.random() * Math.PI * 2,
        }));
      }

      let last = 0;
      function frame(t) {
        const dt = Math.min(32, t - last || 16);
        last = t;
        ctx.clearRect(0, 0, width, height);
        for (const star of stars) {
          star.y += star.s * dt * 0.06;
          star.p += dt * 0.001;
          if (star.y > height + 4) {
            star.y = -4;
            star.x = Math.random() * width;
          }
          const twinkle = 0.55 + Math.sin(star.p) * 0.45;
          ctx.globalAlpha = star.a * twinkle;
          ctx.fillStyle = "#dce9ff";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener("resize", resize);
      requestAnimationFrame(frame);

      let entered = false;
      function enter() {
        if (entered) return;
        entered = true;
        document.body.classList.add("entering");
        hint.classList.add("entering");
        hint.textContent = "正在进入…";
        try {
          if (window.Sewo) {
            setTimeout(() => window.Sewo.enter().catch(() => {}), 650);
          }
        } catch (_) {}
      }

      document.body.addEventListener("click", enter);
      document.body.addEventListener("touchstart", enter, { passive: true });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") enter();
      });

      if (window.Sewo) {
        window.Sewo.onStatus((s) => {
          if (!s) return;
          if (s.error) {
            status.textContent = s.error;
            hint.textContent = "启动失败，点击重试";
            entered = false;
            document.body.classList.remove("entering");
            return;
          }
          if (entered) {
            status.textContent = s.mainReady ? "正在打开希沃白板…" : "正在准备希沃白板…";
          } else if (!s.seewoRunning) {
            status.textContent = "正在启动希沃白板…";
          } else {
            status.textContent = "";
          }
        });
      }
    })();
  </script>
</body>
</html>
