[package]
name = "seewo-splash-switcher"
version = "0.1.6"
description = "Seewo EasiNote splash screen switcher with HTML themes"
authors = ["ycyz2505"]
edition = "2021"
rust-version = "1.77"
default-run = "seewo-splash-switcher"

[lib]
name = "seewo_splash_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
log = { version = "0.4", features = ["std"] }
minisign-verify = "0.2"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "socks"] }
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
axum = "0.7"
url = "2"
urlencoding = "2"
winreg = "0.52"
zip = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
